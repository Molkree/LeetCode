version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "yearly"
    groups:
      yearly-batch:
        patterns:
          - "*"
    cooldown:
      default-days: 8
    commit-message:
      prefix: "build"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "yearly"
    groups:
      yearly-batch:
        patterns:
          - "*"
    cooldown:
      default-days: 8
    commit-message:
      prefix: "ci"
