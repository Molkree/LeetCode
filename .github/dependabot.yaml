version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    groups:
      weekly-batch:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    groups:
      weekly-batch:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
