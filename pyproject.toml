[project]
name = "LeetCode"
version = "0.1.0"
requires-python = ">=3.14"
authors = [{ name = "Dmitrii Volodin", email = "mr.molkree@gmail.com" }]

[dependency-groups]
build = ["uv==0.13.5"]
dev = [
    "black==26.10.1",
    "flake8-bugbear==26.9.30",
    "Flake8-pyproject==1.2.4",
    "flake8==7.4.1",
    "isort==9.0.2",
    "mypy==2.4.0",
    "pep8-naming==0.15.1",
    "prek==0.5.5",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.exclude-newer-package]
uv = "2026-10-22T01:32:33.910Z"

[tool.flake8]
max-line-length = 80
extend-select = ["B950"]
extend-ignore = ["E203", "E501", "E701"]

[tool.isort]
profile = "black"
